services:
  dashboard:
    # For a Coolify Compose service, replace this with a pinned Git build context.
    build:
      context: ../../dashboard
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Required}
      SESSION_SECRET: ${SESSION_SECRET:?Required}
      KEY_HASH_SECRET: ${KEY_HASH_SECRET:?Required}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:?Required}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:?Set the private relay /v1 URL}
      MODEL_ID: ${MODEL_ID:?Required}
      DEFAULT_NODE_ID: ${DEFAULT_NODE_ID:?Set the existing node ID}
      DEFAULT_NODE_NAME: ${DEFAULT_NODE_NAME:?Set the node name}
      DEFAULT_NODE_ROUTE_ALIAS: ${DEFAULT_NODE_ROUTE_ALIAS:-}
    volumes:
      - dashboard-data:/data
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
volumes:
  dashboard-data:
