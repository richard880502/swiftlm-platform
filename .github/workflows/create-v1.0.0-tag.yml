name: Create v1.0.0 tag

on:
  push:
    branches:
      - feature/chat-markdown-rendering
    paths:
      - .github/workflows/create-v1.0.0-tag.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.0.0 tag on release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: 56f584d8f5b64a328572600cf41432e52cc04c2d
        run: |
          set -euo pipefail
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${RELEASE_SHA}"
          git tag v1.0.0 "${RELEASE_SHA}"
          git push origin refs/tags/v1.0.0
